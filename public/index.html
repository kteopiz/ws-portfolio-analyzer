<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wealthsimple Portfolio Analyzer</title>
  </head>
  <body>
    <main>
      <h1>Upload your holdings</h1>
      <form action="/api/holdings" method="post" enctype="multipart/form-data">
        <label for="holdings">Holdings CSV</label>
        <input id="holdings" name="holdings" type="file" required accept=".csv,text/csv" />
        <button type="submit">Upload</button>
      </form>
    </main>
  </body>
</html>
